########################################
# Backend
########################################

backend = "glx";
vsync = true;

########################################
# Shadows
########################################

shadow = true;
shadow-radius = 18;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.35;

shadow-ignore-shaped = false;

########################################
# Fading
########################################

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 8;

########################################
# Opacity
########################################

inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 0.90;

########################################
# Blur (Glass Effect)
########################################

blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;

########################################
# Rounded Corners (optional)
########################################

corner-radius = 0;

########################################
# Exclusions
########################################

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@"
];

shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "name = 'Notification'",
    "_GTK_FRAME_EXTENTS@"
];

########################################
# Misc
########################################

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
use-damage = true;
